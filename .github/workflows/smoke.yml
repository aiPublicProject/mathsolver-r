name: smoke (real API)
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secret
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "::error::SMOKE_API_KEY secret not configured (repo/org Settings - Secrets - Actions)"
            exit 1
          fi
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e "install.packages(\"jsonlite\", repos=\"https://cloud.r-project.org\")"
      - run: Rscript tests/run.R
